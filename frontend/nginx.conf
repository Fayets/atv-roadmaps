server {
    listen 80;
    server_name roadmaps.atvos.io;
    root /usr/share/nginx/html;
    index index.html;

    # Detrás del nginx del host, este no sabe que el pedido vino por HTTPS. Con
    # redirects relativos el navegador conserva el esquema con el que entró.
    absolute_redirect off;
    port_in_redirect off;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA: /f/<token> y /r/<token> los resuelve React, no el disco.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        # La generación con la IA puede tardar minutos.
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:8000;
    }
}
