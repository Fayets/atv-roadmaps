services:
  backend:
    build: ./backend
    container_name: atv-roadmaps-backend
    restart: always
    ports:
      - "8014:8000"
    env_file:
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      # Solo si se corriera con SQLite; en el server la base es Neon.
      - /opt/atv-roadmaps/data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        # El frontend habla con /api por el mismo origen (nginx del host).
        - VITE_API_URL=
    container_name: atv-roadmaps-frontend
    restart: always
    ports:
      - "8094:80"
    depends_on:
      - backend
